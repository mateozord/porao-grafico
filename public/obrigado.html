<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pedido recebido | PORAO GRAFICO</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #080708;
        color: #efe7dc;
        font-family: Arial, sans-serif;
      }

      main {
        width: min(92vw, 720px);
        border: 1px solid rgba(239, 231, 220, 0.18);
        background: rgba(0, 0, 0, 0.35);
        padding: 32px;
      }

      h1 {
        margin: 0;
        font-family: Impact, Haettenschweiler, "Arial Narrow", sans-serif;
        font-size: clamp(44px, 10vw, 92px);
        line-height: 0.9;
        text-transform: uppercase;
      }

      p {
        color: #c7bdae;
        font-size: 18px;
        line-height: 1.6;
      }

      a {
        display: inline-block;
        margin-top: 16px;
        border: 1px solid #c03377;
        background: #c03377;
        color: #efe7dc;
        padding: 14px 18px;
        text-decoration: none;
        text-transform: uppercase;
        font-weight: 900;
        letter-spacing: 0.14em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Pedido recebido.</h1>
      <p>
        Valeu. Sua mensagem chegou no porao. Em breve eu retorno com os
        proximos passos do orcamento.
      </p>
      <a href="/">Voltar para o site</a>
    </main>
  </body>
</html>
